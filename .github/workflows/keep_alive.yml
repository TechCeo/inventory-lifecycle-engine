name: Hourly Render Availability Check

on:
  schedule:
    # Paid Render services stay active; this is a low-frequency availability check.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-live-demo-warm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  keep-alive:
    name: Ping ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 4

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: Render API
            url: https://inventory-lifecycle-engine-api.onrender.com/healthz
          - service: Keycloak
            url: https://inventory-lifecycle-engine-keycloak.onrender.com/realms/expiry-notification/.well-known/openid-configuration

    steps:
      - name: Ping direct Render endpoint
        env:
          TARGET_URL: ${{ matrix.url }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 1 \
            --retry-all-errors \
            --retry-delay 5 \
            --output /dev/null \
            --write-out 'HTTP %{http_code} in %{time_total}s\n' \
            "$TARGET_URL"
